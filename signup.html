<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your Sarkari Hub account.">
  <title>Sign Up | Sarkari Hub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .signup-page{min-height:100vh;display:grid;place-items:center;padding:32px 18px;background:linear-gradient(135deg,#f7fafc,#eef4ff)}
    .signup-shell{width:min(100%,460px)}
    .signup-back{display:inline-flex;align-items:center;gap:7px;margin-bottom:16px;color:#526071;text-decoration:none;font-weight:700}
    .signup-card{background:#fff;border:1px solid #e4e9f0;border-radius:24px;padding:34px;box-shadow:0 20px 60px rgba(20,35,60,.10)}
    .signup-logo{font-size:42px;margin-bottom:8px}.signup-card h1{margin:0 0 8px;font-size:32px}.signup-card>p{margin:0 0 24px;color:#667085;line-height:1.6}
    .signup-form{display:grid;gap:15px}.signup-form label{font-size:14px;font-weight:800;color:#344054}.signup-form input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #d8dee8;border-radius:12px;font:inherit;outline:none}.signup-form input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.10)}
    .signup-check{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:#667085;line-height:1.5}.signup-check input{width:auto;margin-top:3px}.signup-btn{border:0;border-radius:12px;padding:14px;background:#111827;color:#fff;font:inherit;font-weight:800;cursor:pointer}.signup-btn:hover{opacity:.92}.signup-btn:disabled{opacity:.6;cursor:wait}
    .signup-message{display:none;padding:12px 14px;border-radius:12px;background:#ecfdf3;color:#067647;font-size:14px;font-weight:700;margin-bottom:15px}.signup-message.show{display:block}.signup-error{background:#fef2f2;color:#b42318}.signup-note{margin-top:18px;font-size:12px;color:#7a8492;line-height:1.55;text-align:center}
    body.dark .signup-page{background:#0b1220}.dark .signup-card{background:#111827;border-color:#263244}.dark .signup-card h1,.dark .signup-form label{color:#f3f4f6}.dark .signup-card>p,.dark .signup-back,.dark .signup-check,.dark .signup-note{color:#aab4c3}.dark .signup-form input{background:#0f172a;color:#fff;border-color:#334155}
    @media(max-width:520px){.signup-card{padding:25px 20px;border-radius:20px}.signup-card h1{font-size:28px}}
  </style>
</head>
<body>
  <main class="signup-page">
    <div class="signup-shell">
      <a class="signup-back" href="index.html">← Back to Sarkari Hub</a>
      <section class="signup-card">
        <div class="signup-logo">🇮🇳</div>
        <h1>Create your account</h1>
        <p>Sign up to personalize your Sarkari Hub experience.</p>
        <div id="signupMessage" class="signup-message"></div>
        <form id="signupForm" class="signup-form" novalidate>
          <div><label for="name">Full name</label><input id="name" name="name" type="text" placeholder="Enter your name" autocomplete="name" required></div>
          <div><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required></div>
          <div><label for="password">Password</label><input id="password" name="password" type="password" placeholder="Create a password" minlength="8" autocomplete="new-password" required></div>
          <div><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" placeholder="Repeat your password" minlength="8" autocomplete="new-password" required></div>
          <label class="signup-check"><input id="terms" type="checkbox" required><span>I agree to use Sarkari Hub responsibly and verify official government domains before sharing sensitive information.</span></label>
          <button id="signupBtn" class="signup-btn" type="submit">Create Account →</button>
        </form>
        <div class="signup-note">Your name and email are sent to the Google Sheet only after you submit this form. Never collect or store passwords in a Google Sheet.</div>
      </section>
    </div>
  </main>
  <script>
    // After deploying your Google Apps Script Web App, paste its /exec URL below.
    const GOOGLE_SHEET_WEB_APP_URL = 'PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';
    const form = document.getElementById('signupForm');
    const message = document.getElementById('signupMessage');
    const button = document.getElementById('signupBtn');

    function showMessage(text, error=false){
      message.textContent=text;
      message.className='signup-message show' + (error ? ' signup-error' : '');
    }

    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      if(!form.checkValidity()){form.reportValidity();return;}
      const name=document.getElementById('name').value.trim();
      const email=document.getElementById('email').value.trim();
      const password=document.getElementById('password').value;
      const confirm=document.getElementById('confirmPassword').value;
      if(password!==confirm){showMessage('Passwords do not match.',true);return;}
      if(GOOGLE_SHEET_WEB_APP_URL.includes('PASTE_YOUR')){
        showMessage('Google Sheet connection is not configured yet. Add your Apps Script Web App URL in signup.html.',true);
        return;
      }
      button.disabled=true;
      button.textContent='Creating account...';
      try{
        const body=new URLSearchParams({name,email,source:'Sarkari Hub Sign Up'});
        const response=await fetch(GOOGLE_SHEET_WEB_APP_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body});
        const result=await response.json().catch(()=>({ok:true}));
        if(!response.ok || result.ok===false) throw new Error(result.message || 'Unable to save your details.');
        localStorage.setItem('sarkari-user',JSON.stringify({name,email}));
        showMessage('Account details saved successfully. Welcome to Sarkari Hub! 🎉');
        form.reset();
      }catch(error){
        showMessage('Could not save your details right now. Please try again.',true);
      }finally{
        button.disabled=false;
        button.textContent='Create Account →';
      }
    });
  </script>
</body>
</html>
