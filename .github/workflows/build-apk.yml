name: Build Sarkari Hub Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Cordova
        run: npm install --global cordova

      - name: Create Android wrapper for Sarkari Hub
        run: |
          cordova create sarkari-hub com.ajayavn512.sarkarihub "Sarkari Hub"
          cd sarkari-hub
          cat > config.xml <<'EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.ajayavn512.sarkarihub" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>Sarkari Hub</name>
            <description>Government services, jobs, results and admit-card links in one place.</description>
            <author email="ajayavn512@gmail.com">Ajay</author>
            <content src="https://ajayavn512.github.io/Sarkari-Hub/" />
            <access origin="*" />
            <allow-navigation href="https://ajayavn512.github.io/*" />
            <allow-navigation href="https://*.github.io/*" />
            <allow-navigation href="https://*/*" />
            <preference name="AndroidXEnabled" value="true" />
            <preference name="DisallowOverscroll" value="true" />
            <preference name="Orientation" value="default" />
            <preference name="Fullscreen" value="false" />
            <preference name="SplashScreenDelay" value="1500" />
            <platform name="android">
              <preference name="android-minSdkVersion" value="24" />
              <preference name="android-targetSdkVersion" value="35" />
            </platform>
          </widget>
          EOF
          cordova platform add android@13
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sarkari-Hub-Android-APK
          path: sarkari-hub/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
