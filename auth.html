<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#155eef"><title>Login | Sarkari Hub</title><link rel="stylesheet" href="style.css"><style>.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#f6f9ff,#e9f0ff)}.auth-card{width:min(100%,460px);padding:30px;background:white;border:1px solid #dce5f5;border-radius:24px;box-shadow:0 20px 60px #17356b18}.auth-card h1{margin:8px 0}.auth-card p{color:#667085}.auth-form{display:grid;gap:12px;margin:20px 0}.auth-form input{padding:13px;border:1px solid #d0d9e8;border-radius:12px;font:inherit}.auth-form button,.auth-actions button{padding:13px;border:0;border-radius:12px;background:#155eef;color:white;font:inherit;font-weight:800;cursor:pointer}.auth-actions{display:flex;gap:10px;flex-wrap:wrap}.auth-actions button+button{background:#eaf0ff;color:#155eef}.auth-msg{padding:12px;border-radius:10px;background:#f2f4f7;color:#344054;white-space:pre-wrap}.auth-small{font-size:12px;margin-top:18px}</style></head>
<body><main class="auth-wrap"><section class="auth-card"><a href="index.html">← Back to Sarkari Hub</a><div style="font-size:38px;margin-top:20px">🇮🇳</div><h1>Welcome to Sarkari Hub</h1><p>Sign in to sync saved links across your devices.</p><form class="auth-form" id="authForm"><label>Email address<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="At least 6 characters"></label><div class="auth-actions"><button type="submit" id="loginBtn">Sign in</button><button type="button" id="createBtn">Create account</button></div></form><div id="authMsg" class="auth-msg" role="status">Firebase setup is required before login can work. See SETUP-GUIDE.md.</div><p class="auth-small">Use a unique password. Never share your password or OTP with anyone.</p></section></main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { firebaseConfig, isFirebaseConfigured } from './firebase-config.js';
const msg=document.getElementById('authMsg'),form=document.getElementById('authForm');
if(!isFirebaseConfigured()){msg.textContent='Firebase is not configured yet. Open firebase-config.js and add the web app config from your Firebase Console, then enable Email/Password Authentication and Firestore.';}
else{
 try{
  const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
  onAuthStateChanged(auth,user=>{if(user)msg.textContent='Signed in as '+user.email+'. Your saved links can now sync on this device.'});
  form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Signing in…';try{await signInWithEmailAndPassword(auth,document.getElementById('email').value.trim(),document.getElementById('password').value);location.href='index.html'}catch(err){msg.textContent='Sign in failed: '+err.message}});
  document.getElementById('createBtn').addEventListener('click',async()=>{if(!form.reportValidity())return;msg.textContent='Creating account…';try{const credential=await createUserWithEmailAndPassword(auth,document.getElementById('email').value.trim(),document.getElementById('password').value);await setDoc(doc(db,'users',credential.user.uid),{email:credential.user.email,createdAt:serverTimestamp(),savedLinks:[]});msg.textContent='Account created. Redirecting…';location.href='index.html'}catch(err){msg.textContent='Account creation failed: '+err.message}});
 }catch(err){msg.textContent='Firebase setup error: '+err.message}
}
</script></body></html>
